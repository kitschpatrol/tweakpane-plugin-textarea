<!doctype html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta charset="UTF-8" />
		<title>Text Area Plugin Test</title>
		<style>
			body {
				background-color: rgb(203 203 203);
			}

			#output {
				white-space: pre-line;
			}
		</style>
	</head>
	<body>
		<div id="output">Type in the text area to refresh content live...</div>
		<script type="module">
			import * as Tweakpane from 'tweakpane'
			import * as TweakpanePluginTextarea from '../src/index.ts'

			// Object with multiline text property
			const params = {
				prop: 'Line1\nLine2\nLine3',
			}

			// Create the panel
			const pane = new Tweakpane.Pane()
			window.pane = pane

			// Register plugin
			pane.registerPlugin(TweakpanePluginTextarea)

			// Add text area input
			pane
				.addBinding(params, 'prop', {
					view: 'textarea',
					rows: 6,
					placeholder: 'Type here...',
				})
				.on('change', (ev) => {
					console.log(ev.value)
					document.getElementById('output').textContent = ev.value
				})

			const btn = pane.addButton({
				title: 'Randomize',
			})

			btn.on('click', () => {
				let content = Array.from(
					Array(3),
					(d, i) =>
						i +
						1 +
						' ' +
						Math.random()
							.toString(36)
							.replace(/[^a-z]+/gu, '')
							.substr(0, 10),
				).join('\n')
				params.prop = content
				pane.refresh()
				console.log(params)
			})
		</script>
	</body>
</html>
